spring.application.name=devpulse-backend
server.servlet.context-path=/api

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:devpulse}
spring.datasource.username=${POSTGRES_USER:devpulse}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.flywaydb=INFO

# Legacy verifier is WS-only pending PWDRZ-104; REST never issues/accepts JWT.
ws.legacy-jwt-secret=${JWT_SECRET}

# Standard JDBC sessions are managed by SessionConfig; Flyway owns their schema.
app.session-cookie.secure=${COOKIE_SECURE:true}
app.legacy-cookie.path=${COOKIE_PATH:/api/auth}

# Opening details (PWDRZ-186): an opening names its reader for this long, then
# the reader is cleared and the opening stays counted. 30 days is the longest
# analytics window. See OpeningDetailRetention.
app.analytics.opening-detail-retention=30d
app.analytics.opening-detail-cleanup-cron=0 0 * * * *
app.analytics.opening-detail-batch-size=1000


# Swagger UI — disabled by default; set SWAGGER_ENABLED=true in local dev
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
# Controllers return JSON; without this the document advertises */*
springdoc.default-produces-media-type=application/json
# Sorted, pretty-printed output, so the committed backend/openapi.json diffs cleanly
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# AI tag suggestions (PWDRZ-147): any OpenAI-compatible chat completions API.
# Without all three values the backend suggests tags by keyword extraction only.
ai.base-url=${AI_BASE_URL:}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:}
ai.timeout=${AI_TIMEOUT:10s}
