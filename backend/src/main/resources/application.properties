spring.application.name=devpulse-backend

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:devpulse}
spring.datasource.username=${POSTGRES_USER:devpulse}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiry=${JWT_ACCESS_EXPIRY:900}
jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800}
