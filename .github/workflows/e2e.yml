name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Run the deliberately failing browser assertion (gate verification only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install E2E dependencies
        run: npm ci --workspace orbita-e2e --include-workspace-root

      - name: Check E2E tooling
        run: |
          npx nx run e2e:typecheck
          npx nx run e2e:format-check
          npx nx run e2e:infra-test

      - name: Install Chromium and system dependencies
        run: npm exec --workspace orbita-e2e -- playwright install --with-deps chromium

      - name: Run isolated browser and integration gate
        env:
          FAILURE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe }}
        run: |
          if [ "$FAILURE_PROBE" = "true" ]; then
            npx nx run e2e:probe
          else
            npx nx run e2e:test
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
