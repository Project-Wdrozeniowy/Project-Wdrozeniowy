name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  frontend-lint:
    name: Frontend Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root

      - name: Lint
        run: npx nx run frontend:lint

      - name: Format check
        run: npx nx run frontend:format-check

  gateway-lint:
    name: Gateway Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace gateway --include-workspace-root

      - name: Lint
        run: npx nx run gateway:lint

      - name: Format check
        run: npx nx run gateway:format-check
