name: Frontend Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'backend/openapi.json'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tools/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/openapi.json'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tools/**'
      - '.github/workflows/frontend-build.yml'

  workflow_dispatch:

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root

      - name: Type check
        run: npx nx run frontend:typecheck

      - name: Build
        run: npx nx run frontend:build
