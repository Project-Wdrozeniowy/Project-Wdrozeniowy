name: Backend Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tools/**'
      - '.github/workflows/backend-build.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tools/**'
      - '.github/workflows/backend-build.yml'

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci --workspaces=false

      - name: Build (skip tests)
        run: npx nx run backend:build
