name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  frontend-test:
    name: Frontend Tests (coverage gates)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root

      - name: Run tests with coverage
        run: npx nx run frontend:coverage

  gateway-test:
    name: Gateway Tests (coverage gates)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace gateway --include-workspace-root

      - name: Run tests with coverage
        run: npx nx run gateway:coverage

  backend-test:
    name: Backend Tests (coverage gates)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devpulse
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Postgres is reachable
        run: pg_isready -h localhost -p 5432 -U devpulse -d devpulse

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci --workspaces=false

      - name: Run tests with coverage check
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devpulse
          SPRING_DATASOURCE_USERNAME: devpulse
          SPRING_DATASOURCE_PASSWORD: devpulse
          POSTGRES_DB: devpulse
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hmac-sha256
        run: npx nx run backend:coverage:ci

  workspace-tooling:
    name: Workspace Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces=false
      - run: npx nx run tooling:format-check
      - run: npx nx run tooling:infra-test
      - run: npx nx show projects
